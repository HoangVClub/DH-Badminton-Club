<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DH Badminton Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>

/* Layout: một cột hẹp như màn hình điện thoại. Phong cách sticker: viền mực dày, bóng đổ cứng, màu kẹo trên nền tím nhạt chấm bi.
   Hai ô giá (người công ty / khách ngoài) là điểm nhấn chính, tiếp đến tiến độ thu, lưới tên chưa trả, thanh thanh toán cố định phía dưới. */
:root {
  color-scheme: light;
  --bg: #f2eaff;
  --paper: #ffffff;
  --ink: #1a1033;
  --muted: #655c80;
  --pink: #ff5fa8;
  --lime: #c9f53f;
  --sky: #74d4ff;
  --lemon: #ffe066;
  --violet: #5b3cf0;
  --red: #c0134f;
  --display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(rgba(26, 16, 51, .1) 1.3px, transparent 1.5px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  margin: 0;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
.wrap {
  max-width: 560px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { background: var(--lemon); border-bottom: 3px solid var(--ink); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.logo { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); display: block; flex: none; background: #0b1230; }
.brand { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; letter-spacing: .01em; flex: 1; min-width: 0; }
.ghost {
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; box-shadow: 2px 2px 0 var(--ink);
  padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
}
.ghost:active { transform: translate(2px, 2px); box-shadow: none; }
main { padding-block: 20px 140px; display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 4px 4px 0 var(--ink); padding: 16px; min-width: 0; }
.eyebrow {
  display: inline-block; margin: 0 0 8px; background: var(--pink); border: 2px solid var(--ink); border-radius: 999px;
  padding: 3px 12px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
}
h1 { margin: 0 0 2px; font-family: var(--display); font-size: 28px; line-height: 1.15; font-weight: 800; text-wrap: balance; }
.who { margin: 0 0 14px; color: var(--muted); font-size: 13px; font-weight: 600; }
.rates { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 14px; }
.rate { border: 2.5px solid var(--ink); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; min-width: 0; }
.rate.co { background: var(--lime); }
.rate.gu { background: var(--sky); }
.rate span { font-size: 13px; font-weight: 700; }
.rate strong { font-family: var(--display); font-size: 32px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rate small { font-size: 12px; font-weight: 600; opacity: .8; }
.row { display: flex; align-items: center; gap: 10px; padding-block: 5px; font-variant-numeric: tabular-nums; font-weight: 500; }
.row i { flex: 1; height: 0; border-top: 2px dashed rgba(26, 16, 51, .25); }
.row em { font-style: normal; font-weight: 700; }
.row.total { margin-top: 8px; padding-top: 12px; border-top: 2.5px solid var(--ink); font-weight: 800; font-size: 16px; }
.row.total i { display: none; }
.row.total span { flex: 1; }
.row.sponsor { color: var(--violet); }
.fine { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; }
.prog-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.prog-head strong { font-family: var(--display); font-size: 20px; font-weight: 800; }
.prog-head span { color: var(--muted); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 20px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--paper); overflow: hidden; margin-bottom: 14px; }
.meter div { height: 100%; border-right: 2.5px solid var(--ink); background: repeating-linear-gradient(135deg, var(--lime) 0 10px, #b4e22b 10px 20px); transition: width .4s ease; }
.meter div.zero { border-right: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--lime); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
.hint { margin: 2px 2px 0; color: var(--muted); font-size: 14px; font-weight: 500; }
.hint b { color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.tile {
  display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 66px; cursor: pointer;
  background: var(--paper); border: 2.5px solid var(--ink); border-radius: 16px; padding: 10px 12px; box-shadow: 3px 3px 0 var(--ink);
  transition: transform .1s, box-shadow .1s, background .1s;
}
.tile:has(input:checked) { background: var(--lemon); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.tile:has(input:focus-visible) { outline: 3px solid var(--violet); outline-offset: 3px; }
.tile .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile .nm { font-weight: 700; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.tile .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { border: 1.5px solid var(--ink); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 800; }
.tag.co { background: var(--lime); }
.tag.gu { background: var(--sky); }
.amt { font-family: var(--display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.tile input {
  appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 0; display: grid; place-items: center;
  border: 2.5px solid var(--ink); border-radius: 8px; background: var(--paper); cursor: pointer;
}
.tile input:checked { background: var(--ink); }
.tile input:checked::after { content: ""; width: 11px; height: 6px; border-left: 3px solid var(--lime); border-bottom: 3px solid var(--lime); transform: rotate(-45deg) translate(1px, -1px); }
.tile.off { opacity: .55; cursor: default; }
.done { text-align: center; padding: 26px 16px; background: var(--lime); }
.done strong { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; }
.msg { text-align: center; color: var(--muted); padding: 26px 16px; }
.msg strong { display: block; color: var(--ink); font-family: var(--display); font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.msg .btn { margin-top: 16px; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 3px solid var(--ink);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 560px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
.bar strong { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.btn {
  background: var(--pink); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink);
  padding: 12px 22px; font-weight: 800; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { background: #e6e0f2; color: #8b82a5; border-color: #8b82a5; box-shadow: none; cursor: not-allowed; }
.btn.go { background: var(--lime); }
.btn.line { background: var(--paper); }
.btn.block { width: 100%; }
:is(.btn, .ghost, .copy, .mrow button):focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(26, 16, 51, .55); }
.panel {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--paper);
  border: 3px solid var(--ink); border-bottom: 0; border-radius: 24px 24px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.panel h2 { margin: 0 0 6px; font-family: var(--display); font-size: 24px; font-weight: 800; }
.panel .sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.big {
  display: inline-block; margin: 0 0 14px; background: var(--lemon); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink);
  padding: 0 14px; font-family: var(--display); font-size: 38px; font-weight: 800; line-height: 1.3; font-variant-numeric: tabular-nums;
}
.plist { margin: 0 0 14px; }
.plist div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 2px dashed rgba(26, 16, 51, .2); font-weight: 600; }
.plist div:first-child { border-top: 0; }
.plist b { font-family: var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plist span { min-width: 0; overflow-wrap: anywhere; }
.qr { background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); padding: 8px; width: min(260px, 100%); margin: 6px auto 18px; line-height: 0; }
.qr svg { width: 100%; height: auto; display: block; }
.info { border: 2.5px solid var(--ink); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
.info div { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 2px solid rgba(26, 16, 51, .15); }
.info div:first-child { border-top: 0; }
.info span { color: var(--muted); font-size: 13px; width: 90px; flex: none; }
.info b { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; user-select: all; }
.copy { background: var(--lemon); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.fld span { font-size: 13px; font-weight: 600; color: var(--muted); }
.fld input, .fld select, .addrow input, .addrow select {
  background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%;
}
.fld input:focus-visible, .fld select:focus-visible, .addrow input:focus-visible, .addrow select:focus-visible { outline: 3px solid var(--violet); outline-offset: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sect { display: inline-block; margin: 14px 0 10px; background: var(--pink); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.mrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 0; border-top: 2px dashed rgba(26, 16, 51, .2); }
.mrow span { flex: 1 1 120px; min-width: 0; overflow-wrap: anywhere; font-weight: 700; font-size: 14px; }
.mrow button { background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
.mrow button.co { background: var(--lime); }
.mrow button.gu { background: var(--sky); }
.mrow button.paid { background: var(--lime); }
.mrow button.del { color: var(--red); border-color: var(--red); }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.addrow input { flex: 1 1 140px; width: auto; }
.addrow select { flex: 0 0 auto; width: auto; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); background: var(--ink); color: var(--lime); border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 700;
}
@media (prefers-reduced-motion: reduce) { .meter div, .tile { transition: none; } }

[hidden] { display: none !important; }
body { padding-bottom: env(safe-area-inset-bottom, 0px); }
.stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
.stat.bad { background: var(--lemon); }
main { padding-bottom: 230px; }
.bar { left: 12px; right: 12px; bottom: 76px; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); padding: 10px 14px; }
.sheet { inset: 0 0 64px 0; }
.toast { bottom: 170px; }
.tile.pending { cursor: default; background: var(--lemon); }
.tile.pending .amt { font-size: 13px; }
.tile.me { cursor: default; background: var(--lime); }
.tile.me .amt { font-size: 13px; }
</style>
</head>

          e && e.message === "no members" ? "Không thấy danh sách người chơi (cần hàng tiêu đề Tên, Nhóm)." :
          "Trình duyệt không đọc được link bảng tính.";
        statusText = why + " Đang hiển thị số liệu của lần xuất file gần nhất."; statusBad = true;
        render();
      });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && Date.now() - lastLoad > 30000) load(); });
  prep(); render(); load();
})();
</script>
</body>
</html>
